      で構わない。(c) ossie_read で fq_name={fq_table_name} を読み、  存在すれば description / dimensions / measures を取り出す   (無くても error にせず、ossie_yaml_path=None
      で継続する)。(d) trino_query で ''SELECT * FROM {fq_table_name} LIMIT 20'' を実行し、  sample_rows に詰める。0 行でも error にはしない。(e) 各カラムの
      role は Ossie に一致名があればそれを、  無ければ trino_type から ''measure'' (数値系) / ''time'' (date/timestamp) /   ''dimension'' (それ以外)
      を選ぶ。'
    expected_output: TableInspectionResult の JSON。fq_table_name, catalog, schema, table, exists, has_select_priv, error_code,
      message, columns (name/trino_type/nullable/null_ratio/distinct_count/low_value/high_value/role), row_count_estimate,
      ossie_yaml_path, ossie_description, ossie_dimensions, ossie_measures, sample_rows を含む。
    output_model: TableInspectionResult
    inputs:
    - fq_table_name
    context: []
    max_retries: 1
    guardrail: thor.analytics.tasks.inspect_table_guardrail
  - name: viz_plan
    agent: viz_planner
    description: '前タスクの TableInspectionResult のカラム情報から、以下の手順でダッシュボード構成 (VizPlan) を作れ: (a) viz_heuristic に fq_table_name と
      columns   (name / trino_type / role / distinct_count / null_ratio) を渡し、  最大 6 個の Visual 候補を得る。(b) ossie_read で fq_name={fq_table_name}
      を読み、  存在すれば description / sample_queries を参照する。(c) 候補のうち意味の薄いもの (低カーディナリティ dim × 別 dim など)   を落として 3-5 個に絞り、各 Visual
      の name を日本語に整える   (例: ''revenue の推移'' → ''月次売上の推移'')。(d) title は ''このテーブルは何のダッシュボードか'' が伝わる短い日本語に。破壊系のカラム操作は絶対に含めず、SELECT
      / 集計に限定する。'
    expected_output: VizPlan の JSON。fq_table_name, title, visuals ([{name, viz_type, x, y, aggregation, group_by, description}])
      を含む。visuals は最低 1 個。
    output_model: VizPlan
    inputs:
    - fq_table_name
    context:
    - table_inspection
    max_retries: 1
    guardrail: null
  - name: cdv_startup
    agent: dashboard_builder
    description: 'cdv_startup_check を 1 回だけ呼び、Cloudera Data Visualization が起動しているか確認せよ。返り値をそのまま CDVStartupResult として出力する:  running=true
      なら次のタスク (build_dashboard) へ進める。  running=false なら error_code=CDV_NOT_RUNNING と、ユーザーへの  案内 (Workbench の Data メニューから CDV
