    max_retries: 1
    guardrail: null
  - name: propose_schema_and_name
    agent: schema_drafter
    description: サンプル値から各カラムの Trino 型を TypeInferTool で推定し、NameProposerTool で英小文字 + アンダースコアのテーブル名候補を作れ。target_schema (=Trino
      スキーマ) はユーザー指定の {target_schema} を使う。SimilarTableSearchTool で命名衝突と類似データセットを検索し、exact_conflicts と similar_tables に積め。role
      (dimension/measure/time) は数値集計系を measure、date/timestamp を time、それ以外を dimension として分類する。
    expected_output: ProposeSchemaAndNameResult の JSON。catalog, target_schema, proposed_table_name, columns[{name, trino_type,
      nullable, role}], partitioning, similar_tables, exact_conflicts を含む。
    output_model: ProposeSchemaAndNameResult
    inputs:
    - target_schema
    context:
    - locate_s3_object
    - sniff_format
    - extract_data_frame
    max_retries: 1
    guardrail: null
  - name: conflict_and_permissions
    agent: iceberg_table_creator
    description: propose_schema_and_name の結果を受け、TableExistsTool で最終的な衝突チェックと、TrinoMetaTool で CREATE 権限確認を行え。衝突がある (かつ overwrite=false)
      場合は has_conflict=true とerror_code=SCHEMA_NAME_CONFLICT を、CREATE 不可なら has_create_priv=false と error_code=PERM_CREATE_DENIED
      を返せ。どちらも問題ないときのみ後続タスクに進める (Crew.ai の guardrail)。
    expected_output: ConflictAndPermissionsResult の JSON。has_conflict, has_create_priv, resolved_table, error_code, message
      を含む。
    output_model: ConflictAndPermissionsResult
    inputs: []
    context:
    - propose_schema_and_name
    max_retries: 0
    guardrail: thor.ingestion.tasks.conflict_permissions_guardrail
  - name: create_iceberg_table
    agent: iceberg_table_creator
    description: check_conflict_and_permissions が通っている前提で、IcebergCreateTableTool に catalog / target_schema / resolved_table
      / columns / partitioning を渡し、Iceberg テーブルを作成せよ。DDL は Tool 内で組み立てられるので、Agent が手で SQL を書いてはいけない。副作用ありのため max_retries=0。エラーはそのまま返す
      (再試行しない)。
    expected_output: CreateIcebergTableResult の JSON。fq_table_name, ddl, column_count を含む。
    output_model: CreateIcebergTableResult
    inputs: []
    context:
    - propose_schema_and_name
    - conflict_and_permissions
    max_retries: 0
    guardrail: null
  - name: draft_ossie
    agent: ossie_drafter
    description: 作成したテーブルのメタデータから Ossie dataset を組み立て、OssieWriteTool で semantic/datasets/<catalog>/<schema>/<table>.yaml に書き出せ
      (commit=true)。dimensions / measures の判別は propose_schema_and_name の role をそのまま利用。 sample_queries は 2-3 件、日本語の自然言語質問と対応する
      Trino SQL を提示。副作用ありのため max_retries=0。
    expected_output: DraftOssieResult の JSON。fq_name, yaml_path, git_status, commit_sha を含む。
    output_model: DraftOssieResult
    inputs: []
    context:
    - locate_s3_object
    - propose_schema_and_name
    - create_iceberg_table
    - extract_data_frame
    max_retries: 0
    guardrail: null
  - name: wrap_up
    agent: ossie_drafter
    description: これまでのタスク結果を統合し、ユーザーへの最終レポートをIngestionReport JSON として返せ。summary_markdown には作成した fq_table_name、行数目安、カラム数、類似テーブル、Ossie
      YAML のパスを日本語で 5-8 行にまとめる。
