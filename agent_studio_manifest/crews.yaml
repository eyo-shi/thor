    guardrail: thor.analytics.tasks.ensure_cdv_running_guardrail
  - name: build_dashboard
    agent: dashboard_builder
    description: 'VizPlan と TableInspectionResult を使い、Cloudera Data Visualizationに対して以下を順に実行せよ: (a) cdv_dataset_create_or_get
      に fq_table_name を渡して  Dataset を確保する (既存なら再利用)。dataset_id と   dataset_reused (created の否定) を控えておく。(b) VizPlan.visuals
      の各 visual について cdv_visual_create を呼び、  visual_id を集める。  - viz_type=line/bar: x と y は必須。  - viz_type=kpi: y (measure)
      必須、x は None。  - viz_type=pie: x 必須、y は不要 (aggregation=count)。  - viz_type=table: x/y ともに不要。  1 個失敗しても他は続行、失敗内容は notes
      に列挙する。(c) cdv_dashboard_create に title=VizPlan.title と   visual_ids (成功分) を渡し、dashboard_id と dashboard_url を得る。(d) 最終出力
      BuildDashboardResult に   fq_table_name / title / dashboard_id / dashboard_url /   dataset_id / dataset_reused / visual_ids
      / notes を詰める。同じダッシュボードを二重に作らないこと (このタスクは max_retries=0)。'
    expected_output: BuildDashboardResult の JSON。fq_table_name, title, dashboard_id, dashboard_url, dataset_id, dataset_reused,
      visual_ids, notes を含む。
    output_model: BuildDashboardResult
    inputs: []
    context:
    - table_inspection
    - viz_plan
    - cdv_startup
    max_retries: 0
    guardrail: null
