  - dashboard_builder
  tasks:
  - name: table_inspection
    agent: table_inspector
    description: '対象テーブル fq_table_name={fq_table_name} を調査せよ。以下の順で必ず実行する: (a) fq_table_name を catalog / schema / table にパースする
