    agent: s3_scout
    description: ユーザー指示の S3 パス (bucket={bucket}, key={key}) にオブジェクトが実在するか確認し、size / content_type / last_modified を構造化して返せ。存在しなければ
      error_code=S3_NOT_FOUND、権限エラーはS3_ACCESS_DENIED として exists=false で返す。
    expected_output: LocateS3ObjectResult の JSON。bucket, key, size, content_type, last_modified, exists を含む。
    output_model: LocateS3ObjectResult
    inputs:
    - bucket
    - key
    context: []
    max_retries: 1
    guardrail: null
  - name: sniff_format
    agent: format_sniffer
    description: '前段で確定した S3 オブジェクトのフォーマットを判定せよ。手順: (a) S3GetRangeTool で先頭 1MB を取り、MagicByteTool で format を確定。 (b) csv/tsv
      なら CSVSnifferTool で encoding と delimiter を確定。 (c) xlsx/xls なら ExcelHeaderDetectTool で header_row と sheet を確定。 (d) parquet
      なら ParquetMetaTool でスキーマを確認。判定不能なら supported=false + reason を返し、以降のタスクは実行しない。'
    expected_output: SniffFormatResult の JSON。format, encoding, delimiter, sheet, header_row, supported, reason を含む。
    output_model: SniffFormatResult
    inputs: []
    context:
    - locate_s3_object
    max_retries: 1
    guardrail: null
  - name: extract_data_frame
    agent: format_sniffer
    description: DataFramePreviewTool を使って先頭 200 行を DataFrame として読み込み、列ごとにサンプル値 50 個と preview_rows を返せ。SniffFormat の encoding
