  - dispatcher
  tasks:
  - name: intent_classification
    agent: intent_classifier
    description: '以下のユーザー発話を分類せよ。


      USER PROMPT:

      {prompt}


      SESSION_ID: {session_id}


      手順:

      1) 発話に s3://<bucket>/<key> が含まれる、または『取り込み』『インジェスト』『テーブルにして』等の意図があれば intent=''INGEST'' とし、extracted_args に {{bucket,
      key, target_schema}} を抽出する。target_schema が明示されていなければ ''demo'' を入れる。

      2) 発話に『サマリー』『まとめて』『どんな傾向』等が含まれ、対象テーブルが明示されているか代名詞 (『そのテーブル』等) が使われていれば intent=''ANALYZE_SUMMARY''。代名詞は entity_memory_read
      tool を呼んで last_table を引き当て、extracted_args.fq_table_name に埋める。

      3) 発話に『ダッシュボード』『可視化』『グラフを作って』等が含まれれば intent=''ANALYZE_DASHBOARD''。同様に fq_table_name を entity_memory で解決する。

      4) 挨拶・ヘルプ要求・意図不明な雑談は intent=''CHITCHAT''。

      5) 上記いずれにも当てはまらないが情報が足りない場合は intent=''UNKNOWN'' とし、needs_clarification=true, clarification_prompt に日本語で追加質問を書く。


      extracted_args に Knox JWT / STS / パスワード等の秘匿情報は絶対に含めない。confidence は 0.0-1.0 の float で自信度を入れる。'
    expected_output: IntentClassification の JSON。intent, confidence, extracted_args, needs_clarification, clarification_prompt,
      reasoning を含む。
    output_model: IntentClassification
    inputs:
    - prompt
    - session_id
    context: []
    max_retries: 1
    guardrail: null
  - name: dispatch_plan
    agent: dispatcher
    description: "前段の IntentClassification を、Python 側が実行できる DispatchPlan に変換せよ。\n\n変換ルール:\n  intent=INGEST            -> child_crew='ingestion',\
      \ inputs={{bucket, key, target_schema}}, skip_child=false\n  intent=ANALYZE_SUMMARY   -> child_crew='analytics_summary',\
      \ inputs={{fq_table_name, question}}, skip_child=false\n  intent=ANALYZE_DASHBOARD -> child_crew='analytics_dashboard',\
      \ inputs={{fq_table_name, question}}, skip_child=false\n  intent=CHITCHAT          -> child_crew='none', skip_child=true,\
      \ response_markdown に日本語で短い返答を書く\n  intent=UNKNOWN or needs_clarification=true -> child_crew='none', skip_child=true,\
      \ response_markdown に clarification_prompt を書く\n\n重要: あなたは kickoff Tool を『使ってはいけない』。実際の子 Crew 起動は Python 側 (kickoff_router)\
      \ が行う。あなたの仕事はDispatchPlan の JSON を返すことだけ。"
    expected_output: DispatchPlan の JSON。intent, child_crew, inputs, response_markdown, skip_child を含む。
    output_model: DispatchPlan
    inputs: []
    context:
    - intent_classification
    max_retries: 1
    guardrail: null
- name: ingestion
