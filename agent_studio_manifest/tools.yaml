  class_path: thor.tools.trino.TrinoQueryTool
  description: 'Tool Name: trino_query

    Tool Arguments: {''sql'': {''description'': ''実行する SELECT / SHOW / DESCRIBE / EXPLAIN。'', ''type'': ''str''}, ''catalog'':
    {''description'': ''Trino カタログ名'', ''type'': ''str''}, ''schema_'': {''description'': ''Trino スキーマ (省略可)'', ''type'':
    ''Union[str, NoneType]''}, ''max_rows'': {''description'': ''返却する最大行数 (LIMIT 相当)'', ''type'': ''int''}}

