- name: viz_heuristic
  class_path: thor.tools.viz.VizHeuristicTool
  description: 'Tool Name: viz_heuristic

    Tool Arguments: {''fq_table_name'': {''description'': None, ''type'': ''str''}, ''columns'': {''description'': None, ''type'':
    ''list[_ColumnInput]''}, ''max_visuals'': {''description'': None, ''type'': ''int''}}

    Tool Description: Given a table''s fq_table_name and its columns (with role/cardinality), propose 1-6 visualisations (line/bar/pie/kpi/table)
    using deterministic rules. This tool does not call an LLM or hit any external service.'
  requires_auth: false
  args_schema:
    $defs:
      _ColumnInput:
        description: VizHeuristicTool に渡すカラム 1 個分。
        properties:
          name:
            title: Name
            type: string
          trino_type:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            title: Trino Type
          role:
            default: dimension
            description: dimension | measure | time — TableInspectionResult と同じ規約
            title: Role
            type: string
          distinct_count:
            anyOf:
            - minimum: 0
              type: integer
            - type: 'null'
            default: null
            title: Distinct Count
          null_ratio:
            anyOf:
            - maximum: 1.0
              minimum: 0.0
              type: number
            - type: 'null'
            default: null
            title: Null Ratio
        required:
        - name
        title: _ColumnInput
        type: object
    properties:
      fq_table_name:
        title: Fq Table Name
        type: string
      columns:
        items:
          $ref: '#/$defs/_ColumnInput'
        minItems: 1
        title: Columns
        type: array
      max_visuals:
        default: 6
        maximum: 20
        minimum: 1
        title: Max Visuals
        type: integer
    required:
    - fq_table_name
    - columns
    title: VizHeuristicArgs
    type: object
