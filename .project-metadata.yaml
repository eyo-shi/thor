name: Thor
description: |
  Cloudera AI Agent Studio 上で動くマルチエージェント。自然言語で S3 → Iceberg
  取り込み / Data サマリー生成 / Cloudera Data Visualization ダッシュボード作成を
  一気通貫に行う。3 ペイン Web UI (React + Vite) と FastAPI バックエンドを
  Cloudera AI Workbench Application として配信し、Trino / CDV / S3 は Knox JWT +
  IDBroker によるエンドユーザー権限で操作する。セマンティックレイヤは Apache
  Ossie の YAML を Git 管理する。

  ─────────────────────────────────────────────────────────────────
  Deploy 後の設定手順 (Post-Deploy Configuration)
  ─────────────────────────────────────────────────────────────────
  AMP Deploy 時に必要な入力は極力ゼロにしてある。以下は Deploy 完了後に
  **Project → Settings → Advanced → Environment Variables** で設定し、
  同画面から Application を再起動して反映する運用となる。

  1. Trino / CDW への接続
     - Site Administration → Data Connections で CDW / Trino connection を
       登録済みなら、`THOR_TRINO_CONNECTION_NAME` にその connection 名を
       設定する (未設定でも Trino タイプの connection が 1 個なら自動採用)。
     - Data Connections を使わない環境では以下 4 個の env を代わりに設定:
       `THOR_TRINO_HOST`, `THOR_TRINO_PORT` (default 443),
       `THOR_TRINO_CATALOG` (default iceberg), `THOR_TRINO_SCHEMA` (default demo)。

  2. S3 への接続
     - Site Administration → Data Connections で S3 connection を登録済みなら、
       `THOR_S3_CONNECTION_NAME` を設定する (省略時は S3 タイプの最初の
       connection を自動採用)。
     - Data Connections を使わない環境では `THOR_AWS_REGION` (default us-east-1)。
     - 認証情報は IDBroker STS 経由でユーザー単位に払い出されるため、AMP には
       AWS access key / secret は一切保持しない。

  3. LLM プロバイダ (以下いずれか 1 プロバイダを選択)
     - `THOR_LLM_PROVIDER=cai` (default): Cloudera AI Inference。
         必要 env: `CAI_INFERENCE_BASE_URL`, `CAI_INFERENCE_API_KEY`。
         任意 env: `THOR_LLM_ROUTER_MODEL` (default llama-3-8b-instruct),
                  `THOR_LLM_ANALYTICS_MODEL` (default llama-3-70b-instruct)。
     - `THOR_LLM_PROVIDER=anthropic`: Anthropic API。
         必要 env: `ANTHROPIC_API_KEY`。
         任意 env: `ANTHROPIC_BASE_URL`,
                  `THOR_LLM_ROUTER_MODEL` (default claude-3-5-haiku-latest),
                  `THOR_LLM_ANALYTICS_MODEL` (default claude-3-5-sonnet-latest)。
     - `THOR_LLM_PROVIDER=openai`: OpenAI API。
         必要 env: `OPENAI_API_KEY`。
         任意 env: `OPENAI_BASE_URL`,
                  `THOR_LLM_ROUTER_MODEL` (default gpt-4o-mini),
                  `THOR_LLM_ANALYTICS_MODEL` (default gpt-4o)。
     - `THOR_LLM_PROVIDER=bedrock`: Amazon Bedrock (IAM role 前提)。
         必要 env: `AWS_REGION` (または `THOR_AWS_REGION`)。
         任意 env: `THOR_LLM_ROUTER_MODEL`, `THOR_LLM_ANALYTICS_MODEL`。

  4. Cloudera Data Visualization (Deploy 後にプロジェクト内で有効化)
     - Cloudera AI Workbench の Data メニューから CDV を「Enable」する
       (プロジェクトごとに一度だけ実行が必要)。
     - 有効化後に払い出された CDV endpoint URL を `THOR_CDV_BASE_URL` に設定。
     - Trino connection ID を CDV 側で用意している場合は
       `THOR_CDV_TRINO_CONNECTION_ID` に設定 (省略可)。
     - CDV 未設定でも取り込み・サマリーは動く。ダッシュボード生成のみ
       `CDV_NOT_CONFIGURED` エラーで停止し、UI にセットアップ手順が表示される。

  上記いずれかが未設定のまま UI で該当機能を叩くと、API は HTTP 503 + JSON
  ({error_code, instruction}) を返し、UI の SetupGuide カードが手順を表示する。
  設定 → Application 再起動で解消する。

author: Cloudera
date: "2026-09-19"
specification_version: 1.0
prototype_version: 0.0.1

# ---------------------------------------------------------------------------
# Runtime (Python 3.11)
# ---------------------------------------------------------------------------
runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.11
    edition: Standard

# ---------------------------------------------------------------------------
# ユーザー入力 (AMP セットアップ画面のフォームに現れる)
#
# 方針: Deploy 時に必要な項目は極限まで削減する。Trino / S3 は Cloudera AI
# Workbench の Site Administration → Data Connections が single source of
# truth。LLM / CDV は「Deploy 後に Project → Settings → Advanced →
# Environment Variables で設定 → Application 再起動」ワークフローに寄せる
# (詳細は本ファイル冒頭の "Deploy 後の設定手順" を参照)。
# ---------------------------------------------------------------------------
environment_variables:
  THOR_LOG_LEVEL:
    default: "INFO"
    description: structlog のログレベル (DEBUG / INFO / WARNING / ERROR)
    required: false
  THOR_DEMO_MODE:
    default: "off"
    description: >-
      "warm" にすると Tool の重い呼び出しをウォーミング済みのスタブに差し替える
      (デモ保険)。本番は "off"。
    required: false

# ---------------------------------------------------------------------------
# Feature dependencies (Workbench 側の必須機能)
# ---------------------------------------------------------------------------
feature_dependencies:
  - model_deployment

# ---------------------------------------------------------------------------
# セットアップ手順 (上から順に実行される)
# ---------------------------------------------------------------------------
tasks:
  # 1. Python 依存を editable install する。crewai / boto3 / trino / pyarrow …
  - type: run_session
    name: Install Python dependencies
    script: amp/01_install_python_deps.py
    short_summary: pip install -e . で thor パッケージと依存を導入
    long_summary: >-
      pyproject.toml の dependencies を editable install する。 crewai>=0.70,
      boto3, trino, pyarrow, pandas, openpyxl, GitPython, structlog, FastAPI,
      Pydantic v2, PyJWT[crypto] を含む。追加で dev extras (pytest) も入れる。
    kernel: python3
    cpu: 2
    memory: 4

  # 2. React + Vite で thor_ui をビルド → thor/api/static/ に成果物を出す
  - type: run_session
    name: Build Thor UI (React + Vite)
    script: amp/02_build_ui.py
    short_summary: npm ci && npm run build で 3 ペイン UI をビルド
    long_summary: >-
      thor_ui/ (React + TypeScript + Vite) の依存をインストールし、本番ビルドを
      thor/api/static/ に出す。FastAPI が SPA として / から配信する。
    kernel: python3
    cpu: 2
    memory: 4

  # 3. semantic/ (Ossie YAML) の Git 初期化。既存の repo に clone 済みなら no-op
  - type: run_session
    name: Prepare semantic (Ossie) Git repo
    script: amp/03_seed_semantic.py
    short_summary: semantic/ を Git 管理下に置き、Ossie 用ディレクトリを用意
    long_summary: >-
      semantic/{datasets,metrics,relationships,prompts,index} を作成し、
      Ossie Drafter が draft を PR ベースで積めるようにする。既に .git があれば
      スキップ。commit author は Workbench のユーザー ID を使う。
    kernel: python3
    cpu: 1
    memory: 2

  # 4. Agent Studio manifest の drift 検出 (CI ゲートを AMP 側でも走らせておく)
  - type: run_session
    name: Verify Agent Studio manifest is in sync
    script: amp/04_verify_manifest.py
    short_summary: python -m thor.manifest --check で Python ⇄ YAML drift を検出
    long_summary: >-
      agent_studio_manifest/ 配下の YAML が thor.tools / thor.ingestion.crew の
      Python 定義と一致していることを確認する。ズレていたら AMP セットアップは
      失敗する (Model C ハイブリッドの契約)。
    kernel: python3
    cpu: 1
    memory: 2

  # 5. Thor API を Workbench Application として起動 (Knox パススルーで公開)
  - type: start_application
    name: Thor API + UI
    subdomain: thor
    static_subdomain: true
    script: thor/api/main.py
    short_summary: FastAPI + SPA を Workbench Application として起動
    long_summary: >-
      thor.api.main:app を uvicorn で起動する。ポートは Workbench が割り当てる
      CDSW_APP_PORT を使う。FastAPI が /api/* を提供しつつ / で SPA を静的配信
      する。Knox JWT は X-Forwarded-User / Cookie から抽出し、Trino / CDV /
      IDBroker へパススルーする。LLM / Trino / CDV の env は Deploy 後に
      Project Settings で設定する運用 (本ファイル冒頭の設定手順参照)。
    kernel: python3
    cpu: 2
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION
