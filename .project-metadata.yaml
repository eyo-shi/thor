name: Thor
description: |
  Cloudera AI Agent Studio 上で動くマルチエージェント。自然言語で S3 → Iceberg
  取り込み / テーブルサマリー生成 / Cloudera Data Visualization ダッシュボード
  作成を一気通貫に行う。3 ペイン Web UI (React + Vite) と FastAPI バックエンドを
  Cloudera AI Workbench Application として配信し、Trino / CDV / S3 は Knox JWT +
  IDBroker によるエンドユーザー権限で操作する。セマンティックレイヤは Apache
  Ossie の YAML を Git 管理する。

  Deploy 時に必要な入力は Optional な THOR_LOG_LEVEL / THOR_DEMO_MODE の 2 個
  のみ。LLM プロバイダ (cai / anthropic / openai / bedrock 選択式)、Trino / S3
  接続 (Data Connections を優先)、Cloudera Data Visualization は Deploy 完了後に
  Project → Settings → Advanced → Environment Variables で設定し、Application を
  再起動して反映する。未設定のまま UI で該当機能を叩くと API は HTTP 503 +
  guided JSON を返し、SetupGuide カードが手順を表示する。

  詳細な post-deploy 手順は README.md「Deploy 後の設定手順」セクションを参照。

author: Cloudera
date: "2026-09-19"
specification_version: 1.0
prototype_version: 0.0.1

# ---------------------------------------------------------------------------
# Runtime (Python 3.12)
# ---------------------------------------------------------------------------
runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Standard

# ---------------------------------------------------------------------------
# ユーザー入力 (AMP セットアップ画面のフォームに現れる)
#
# 方針: Deploy 時に必要な項目は極限まで削減する。Trino / S3 は Cloudera AI
# Workbench の Site Administration → Data Connections が single source of
# truth。LLM / CDV は「Deploy 後に Project → Settings → Advanced →
# Environment Variables で設定 → Application 再起動」ワークフローに寄せる
# (詳細は本ファイル冒頭の "Deploy 後の設定手順" を参照)。
# ---------------------------------------------------------------------------
environment_variables:
  THOR_LOG_LEVEL:
    default: "INFO"
    description: structlog のログレベル (DEBUG / INFO / WARNING / ERROR)
    required: false
  THOR_DEMO_MODE:
    default: "off"
    description: >-
      "warm" にすると Tool の重い呼び出しをウォーミング済みのスタブに差し替える
      (デモ保険)。本番は "off"。
    required: false

# ---------------------------------------------------------------------------
# Feature dependencies (Workbench 側の必須機能)
# ---------------------------------------------------------------------------
feature_dependencies:
  - model_deployment

# ---------------------------------------------------------------------------
# セットアップ手順 (上から順に実行される)
# ---------------------------------------------------------------------------
tasks:
  # 1. Python 依存を editable install する。crewai / boto3 / trino / pyarrow …
  - type: run_session
    name: Install Python dependencies
    script: amp/01_install_python_deps.py
    short_summary: pip install -e . で thor パッケージと依存を導入
    long_summary: >-
      pyproject.toml の dependencies を editable install する。 crewai>=0.70,
      boto3, trino, pyarrow, pandas, openpyxl, GitPython, structlog, FastAPI,
      Pydantic v2, PyJWT[crypto] を含む。追加で dev extras (pytest) も入れる。
    kernel: python3
    cpu: 2
    memory: 4

  # 2. React + Vite で thor_ui をビルド → thor/api/static/ に成果物を出す
  - type: run_session
    name: Build Thor UI (React + Vite)
    script: amp/02_build_ui.py
    short_summary: nvm + npm ci/build で 3 ペイン UI をビルド
    long_summary: >-
      Workbench runtime に Node.js が無い場合はユーザー領域へ nvm + Node 20 を
      自動導入する。thor_ui/ (React + TypeScript + Vite) を npm ci で依存固定し、
      本番ビルドを thor/api/static/ に出す。FastAPI が SPA として / から配信する。
    kernel: python3
    cpu: 2
    memory: 4

  # 3. semantic/ (Ossie YAML) の Git 初期化。既存の repo に clone 済みなら no-op
  - type: run_session
    name: Prepare semantic (Ossie) Git repo
    script: amp/03_seed_semantic.py
    short_summary: semantic/ を Git 管理下に置き、Ossie 用ディレクトリを用意
    long_summary: >-
      semantic/{datasets,metrics,relationships,prompts,index} を作成し、
      Ossie Drafter が draft を PR ベースで積めるようにする。既に .git があれば
      スキップ。commit author は Workbench のユーザー ID を使う。
    kernel: python3
    cpu: 1
    memory: 2

  # 4. Agent Studio manifest の drift 検出 (CI ゲートを AMP 側でも走らせておく)
  - type: run_session
    name: Verify Agent Studio manifest is in sync
    script: amp/04_verify_manifest.py
    short_summary: python -m thor.manifest --check で Python ⇄ YAML drift を検出
    long_summary: >-
      agent_studio_manifest/ 配下の YAML が thor.tools / thor.ingestion.crew の
      Python 定義と一致していることを確認する。ズレていたら AMP セットアップは
      失敗する (Model C ハイブリッドの契約)。
    kernel: python3
    cpu: 1
    memory: 2

  # 5. Thor API を Workbench Application として起動 (Knox パススルーで公開)
  - type: start_application
    name: Thor API + UI
    entity_label: thor-api
    subdomain: thor
    static_subdomain: true
    script: amp/05_start_application.py
    short_summary: FastAPI + SPA を Workbench Application として起動
    long_summary: >-
      amp/05_start_application.py が CDSW_APP_PORT を待って uvicorn で FastAPI
      ``app`` を localhost bind する。/api/* と SPA (/) を配信。Knox JWT は
      X-Forwarded-User /
      Cookie から抽出し、Trino / CDV / IDBroker へパススルーする。LLM / Trino /
      CDV の env は Deploy 後に Project Settings で設定する運用 (本ファイル冒頭
      の設定手順参照)。
    kernel: python3
    cpu: 2
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION
