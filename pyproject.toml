[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "thor"
version = "0.0.1"
description = "Cloudera AI Agent Studio 上で動作する Databricks Genie 相当のマルチエージェント (Router + Ingestion + Analytics) と、React + FastAPI ベースの 3 ペイン UI。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Cloudera" }]

dependencies = [
  # --- Agent framework / LLM ---
  "crewai>=0.70,<1.0",
  "litellm>=1.40",

  # --- Web API ---
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",

  # --- Data / storage ---
  "boto3>=1.34",
  "trino>=0.328",
  "pyarrow>=16",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",

  # --- Auth / infra ---
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "requests>=2.32",
  "GitPython>=3.1",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
thor-api = "thor.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["thor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
